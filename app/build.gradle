plugins { id 'com.android.application' }

android {
    namespace 'com.tamim.bodybuilding'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tamim.bodybuilding'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release { minifyEnabled false; shrinkResources false }
